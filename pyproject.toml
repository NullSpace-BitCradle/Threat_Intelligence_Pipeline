[tool.mypy]
python_version = "3.13"
# Enable stricter type checking gradually
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Enable later: requires adding type hints to all functions
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Enable later: some decorators lack stubs
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_errors = false
# Additional helpful checks
show_error_codes = true
show_column_numbers = true
pretty = true

# Ignore missing imports for libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "requests.*",
    "tqdm.*",
    "pandas.*",
    "numpy.*",
    "openpyxl.*",
    "aiohttp.*",
    "psutil.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["src/tip"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
show_missing = true
