name: Site Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/smoke/**'
      # tests/conftest.py loads for the smoke suite and imports runtime code,
      # so the lockfiles and that conftest gate it as much as docs/ does.
      - 'tests/conftest.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/smoke-test.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/smoke/**'
      # tests/conftest.py loads for the smoke suite and imports runtime code,
      # so the lockfiles and that conftest gate it as much as docs/ does.
      - 'tests/conftest.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/smoke-test.yml'
  schedule:
    - cron: '47 8 * * *'  # Daily at 08:47 UTC. Schedules can start hours late, so this is not ordered after the database update; the staleness check covers that
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gates the content actually being pushed: serves docs/ from the checkout,
  # so there is no race against the Pages deployment.
  smoke-local:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          # requirements.txt too: tests/conftest.py imports tip.utils.http, which
          # needs requests. The dev lock only carried it transitively before.
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Serve docs/ and run smoke tests against it
        run: |
          python -m http.server 8000 --directory docs &
          sleep 2
          BASE_URL="http://localhost:8000/" pytest tests/smoke/ --browser chromium -q

  # Daily canary against the deployed site: catches deploy drift, Pages
  # outages, and external-dependency rot that the local job cannot see.
  smoke-live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # playwright install alone ran past 10 minutes on 2026-10-26 and 10-27.
    timeout-minutes: 20
    # Issue write access only here, for the pipeline-stale canary alert.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          # requirements.txt too: tests/conftest.py imports tip.utils.http, which
          # needs requests. The dev lock only carried it transitively before.
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Run smoke tests against deployed site
        run: pytest tests/smoke/ --browser chromium -q

      # Staleness canary (I16): reads the deployed freshness.json and opens a
      # pipeline-stale issue when any source is past its threshold or the file
      # cannot be read, which is how runs that never happened get noticed.
      # Closes the issue once every source is fresh. Runs even when the smoke
      # tests failed. It fails the job only when it cannot alert (bad token,
      # missing permission, Issues disabled), so a broken canary is visible.
      # It alerts only from main; a dispatch from another ref still runs the
      # smoke tests but never touches issues.
      - name: Check published data freshness
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          FRESHNESS_URL: https://nullspace-bitcradle.github.io/Threat_Intelligence_Pipeline/data/freshness.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/pipeline_alert.py stale

      # A timeout cancels the job instead of failing it, so the alert covers
      # both; the 10-26 and 10-27 runs died in setup and never ran a test.
      # The script logs and exits 0 on any error, so alerting cannot change
      # the run's result.
      - name: Alert on failure
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_OUTCOME: ${{ job.status }}
          REPO_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/pipeline_alert.py run

      - name: Close failure alert on success
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_OUTCOME: success
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/pipeline_alert.py run
