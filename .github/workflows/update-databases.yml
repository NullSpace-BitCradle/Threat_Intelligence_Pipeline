name: Update Reference Databases

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

# Both data workflows rewrite docs/data and lastUpdate.txt; never let them overlap.
concurrency:
  group: tip-data
  cancel-in-progress: false

jobs:
  update:
    # Publishes to main, so it only ever runs from main. A workflow_dispatch
    # from any other ref is skipped instead of pushing that ref's tree to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Create required directories
        run: python setup.py

      - name: Update reference databases
        env:
          PYTHONPATH: src
        run: python run_pipeline.py --db-only

      # Runs only when the pipeline step succeeded (default if: success()), so a
      # failed or degraded run never publishes. Only data paths are staged, and a
      # run that changed nothing but lastUpdate.txt makes no commit.
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/database lastUpdate.txt
          if git diff --cached --quiet -- docs/data docs/database; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update reference databases [skip ci]"
          git fetch origin main
          # A conflicting rebase fails the run instead of force-pushing over main.
          git rebase origin/main
          # Push only if the branch is exactly the new data commit on top of
          # origin/main, so nothing but this run's data can reach main.
          if [ "$(git rev-parse HEAD~1)" != "$(git rev-parse origin/main)" ]; then
            echo "Refusing to push: HEAD is not one commit on top of origin/main." >&2
            exit 1
          fi
          git push origin HEAD:main
