name: Update Reference Databases

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

# Both data workflows rewrite docs/data and lastUpdate.txt; never let them overlap.
concurrency:
  group: tip-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: python setup.py

      - name: Update reference databases
        env:
          PYTHONPATH: src
        run: python run_pipeline.py --db-only

      # Runs only when the pipeline step succeeded (default if: success()), so a
      # failed or degraded run never publishes. Only data paths are staged, and a
      # run that changed nothing but lastUpdate.txt makes no commit.
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/database lastUpdate.txt
          if git diff --cached --quiet -- docs/data docs/database; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update reference databases [skip ci]"
          git fetch origin main
          # A conflicting rebase fails the run instead of force-pushing over main.
          git rebase origin/main
          git push origin HEAD:main
