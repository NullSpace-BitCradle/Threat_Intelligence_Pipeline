name: Unit Tests and Types

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-mcp.txt -r requirements-dev.txt

      # Coverage gate covers the MCP layer (the P10 bar); the pipeline core has no floor yet.
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q --ignore=tests/smoke --cov=src/tip_mcp --cov-report=term --cov-fail-under=90

      - name: Type check
        run: python -m mypy
