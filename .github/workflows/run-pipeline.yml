name: Run CVE Pipeline

on:
  schedule:
    - cron: '0 8 * * 0'  # Weekly, Sunday at 08:00 UTC
  workflow_dispatch:  # Manual trigger

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: python setup.py

      - name: Run pipeline
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          PYTHONPATH: src
        run: python run_pipeline.py --force

      - name: Copy data to docs for GitHub Pages
        run: |
          mkdir -p docs/data docs/database
          cp resources/*.json resources/*.jsonl docs/data/ 2>/dev/null || true
          cp database/*.jsonl docs/database/ 2>/dev/null || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/ resources/ docs/data/ docs/database/ lastUpdate.txt
          git diff --cached --quiet || (git commit -m "chore: update CVE database [skip ci]" && git push)
