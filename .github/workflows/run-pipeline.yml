name: Run CVE Pipeline

on:
  schedule:
    - cron: '0 8 * * 0'  # Weekly, Sunday at 08:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

# Both data workflows rewrite docs/data and lastUpdate.txt; never let them overlap.
concurrency:
  group: tip-data
  cancel-in-progress: false

jobs:
  pipeline:
    # Publishes to main, so it only ever runs from main. A workflow_dispatch
    # from any other ref is skipped instead of pushing that ref's tree to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Create required directories
        run: python setup.py

      - name: Run pipeline
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          PYTHONPATH: src
        run: python run_pipeline.py --force

      # Runs only when the pipeline step succeeded (default if: success()), so a
      # failed or degraded run never publishes. Only data paths are staged, and a
      # run that changed nothing but lastUpdate.txt makes no commit.
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/database lastUpdate.txt
          if git diff --cached --quiet -- docs/data docs/database; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update CVE database [skip ci]"
          git fetch origin main
          # A conflicting rebase fails the run instead of force-pushing over main.
          git rebase origin/main
          # Push only if the branch is exactly the new data commit on top of
          # origin/main, so nothing but this run's data can reach main.
          if [ "$(git rev-parse HEAD~1)" != "$(git rev-parse origin/main)" ]; then
            echo "Refusing to push: HEAD is not one commit on top of origin/main." >&2
            exit 1
          fi
          git push origin HEAD:main
