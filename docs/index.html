<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Intelligence Pipeline (TIP)</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ===== LANDING PAGE ===== -->
<div id="page-landing" class="landing">
    <div class="landing-brand">THREAT INTELLIGENCE PIPELINE</div>
    <div class="landing-title">Search anything in threat intel</div>
    <div class="landing-subtitle">CVEs, techniques, APT groups, weaknesses, defenses — one search across all frameworks</div>

    <div class="search-container">
        <span class="search-icon">&#128269;</span>
        <input type="text" class="search-input" id="landing-search" placeholder="CVE-2024-37079, T1059, APT29, CWE-79..." autocomplete="off">
        <div class="search-dropdown" id="landing-dropdown"></div>
    </div>

    <div class="hint-chips" id="hint-chips"></div>

    <a class="worklist-link" href="#/list">Build a triage worklist from a list of IDs →</a>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="quick-access">
        <div class="quick-label">Recent KEV Additions</div>
        <div class="quick-grid" id="quick-grid"></div>
    </div>
</div>

<!-- ===== RESULTS PAGE ===== -->
<div id="page-results" class="hidden">
    <div class="top-bar">
        <div class="top-bar-brand" id="brand-home">TIP</div>
        <div class="search-container">
            <span class="search-icon">&#128269;</span>
            <input type="text" class="search-input" id="results-search" autocomplete="off">
            <div class="search-dropdown" id="results-dropdown"></div>
        </div>
        <div class="top-bar-actions">
            <button class="icon-btn" id="btn-pin" title="Pin to investigation">&#128204;</button>
            <div style="position:relative;">
                <button class="icon-btn" id="btn-investigation" title="Investigation tray">
                    <span id="pin-count">0</span>
                </button>
                <div class="investigation-tray" id="investigation-tray"></div>
            </div>
            <button class="icon-btn" id="btn-export" title="Export">&#8599;</button>
            <button class="icon-btn" id="btn-theme" title="Toggle theme">&#9790;</button>
        </div>
    </div>

    <div class="result-body">
        <div class="result-main" id="result-main"></div>
        <div class="result-graph" id="result-graph"></div>
    </div>
</div>

<!-- ===== SEARCH RESULTS LIST PAGE ===== -->
<div id="page-search-results" class="hidden">
    <div class="top-bar">
        <div class="top-bar-brand" id="brand-home-sr">TIP</div>
        <div class="search-container">
            <span class="search-icon">&#128269;</span>
            <input type="text" class="search-input" id="sr-search" autocomplete="off">
            <div class="search-dropdown" id="sr-dropdown"></div>
        </div>
        <div class="top-bar-actions">
            <button class="icon-btn" id="btn-theme-sr" title="Toggle theme">&#9790;</button>
        </div>
    </div>
    <div class="search-results-page" id="search-results-body"></div>
</div>

<!-- ===== WORKLIST / TRIAGE PAGE ===== -->
<div id="page-worklist" class="hidden">
    <div class="top-bar">
        <div class="top-bar-brand" id="brand-home-wl">TIP</div>
        <div class="worklist-title">Worklist · triage</div>
        <div class="top-bar-actions">
            <button class="icon-btn" id="btn-theme-wl" title="Toggle theme">&#9790;</button>
        </div>
    </div>
    <div class="worklist-page">
        <div class="worklist-controls">
            <textarea id="worklist-input" class="worklist-input"
                placeholder="Paste IDs — CVE-2023-44487, T1499, CWE-79, APT29 (comma, space, or newline separated)"></textarea>
            <div class="worklist-actions">
                <button id="worklist-build" class="worklist-build-btn">Build worklist</button>
                <label class="worklist-toggle"><input type="checkbox" id="worklist-kev-only"> KEV only</label>
            </div>
        </div>
        <div id="worklist-status" class="worklist-status"></div>
        <div id="worklist-table"></div>
    </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="js/entity-system.js"></script>
<script src="js/graph.js"></script>
<script src="js/results.js"></script>
<script src="js/worklist.js"></script>
<script src="js/app.js"></script>

</body>
</html>
